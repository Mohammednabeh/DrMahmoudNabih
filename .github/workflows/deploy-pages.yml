name: Deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ mohammadabeh-publish-github-pages, mohammednabeh-publish-github-pages, main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build (if package.json has build)
        run: |
          if [ -f package.json ] && grep -q "\"build\"" package.json; then
            echo "Building project"
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build
            echo "Build complete. Listing files:"
            ls -la
            if [ -d dist ]; then ls -la dist || true; fi
            if [ -d build ]; then ls -la build || true; fi
            if [ -d public ]; then ls -la public || true; fi
          else
            echo "No build script detected; skipping build step"
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./dist
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
