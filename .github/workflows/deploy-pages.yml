name: Deploy to GitHub Pages

on:
  push:
    branches: [ mohammadabeh-publish-github-pages, mohammednabeh-publish-github-pages, main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build (if package.json has build and no build output)
        run: |
          if [ -f package.json ] && grep -q "\"build\"" package.json; then
            if [ -d dist ] || [ -d build ] || [ -d public ]; then
              echo "Build artifacts present; skipping build"
            else
              if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                npm ci
              else
                npm install
              fi
              npm run build
            fi
          else
            echo "No build script detected; skipping build step"
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: |
            ./dist
            ./build
            ./public
            ./
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
